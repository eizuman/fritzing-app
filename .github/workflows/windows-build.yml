name: Build Fritzing for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Check out Fritzing source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Enable MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtserialport qt5compat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install `
            libgit2:x64-windows `
            zlib:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed."
          }

      - name: Download header-only and source dependencies
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path

          $boostArchive = "$env:RUNNER_TEMP\boost_1_85_0.zip"
          & curl.exe --fail --location --retry 3 `
            --output $boostArchive `
            https://archives.boost.io/release/1.85.0/source/boost_1_85_0.zip
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download Boost 1.85.0."
          }

          $boostExtract = "$env:RUNNER_TEMP\boost-extract"
          Expand-Archive $boostArchive -DestinationPath $boostExtract

          $boostVersion = Get-ChildItem $boostExtract -Recurse -Filter version.hpp |
            Where-Object { $_.FullName -like "*\boost\version.hpp" } |
            Select-Object -First 1
          if (-not $boostVersion) {
            throw "Boost archive does not contain boost/version.hpp."
          }

          $boostSource = $boostVersion.Directory.Parent.FullName
          $boostDestination = "$root\boost_1_85_0"
          Move-Item $boostSource $boostDestination
          if (-not (Test-Path "$boostDestination\boost\version.hpp")) {
            throw "Boost was not placed in the expected directory."
          }

          git clone --depth 1 --branch develop `
            https://github.com/fritzing/fritzing-parts.git `
            "$root\fritzing-parts"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone fritzing-parts."
          }

          git clone --depth 1 --branch v1.3.1 `
            https://github.com/svgpp/svgpp.git `
            "$root\svgpp-1.3.1"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone SVG++ 1.3.1."
          }

      - name: Build QuaZip against installed Qt
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $source = "$env:RUNNER_TEMP\quazip"
          $build = "$env:RUNNER_TEMP\quazip-build"
          $prefix = "$root\quazip-1.4"

          git clone --depth 1 --branch v1.4 `
            https://github.com/stachenov/quazip.git $source
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone QuaZip 1.4."
          }

          cmake -S $source -B $build `
            -DQUAZIP_QT_MAJOR_VERSION=6 `
            -DQUAZIP_FETCH_LIBS=OFF `
            -DQUAZIP_BZIP2=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\vcpkg\installed\x64-windows"
          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip configuration failed."
          }

          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip build failed."
          }

          cmake --install $build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip installation failed."
          }

      - name: Prepare Clipper 6.4.2
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $source = "$env:RUNNER_TEMP\clipper-source"
          $destination = "$root\Clipper1-6.4.2"

          git clone --depth 1 --branch 6.4.2 `
            https://github.com/skyrpex/clipper.git $source
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone Clipper 6.4.2."
          }

          $cpp = "$source\cpp\clipper.cpp"
          $header = "$source\cpp\clipper.hpp"

          New-Item -ItemType Directory -Force `
            -Path "$destination\include\polyclipping", "$destination\lib" | Out-Null
          Copy-Item $header "$destination\include\polyclipping\clipper.hpp"

          cl /nologo /std:c++20 /EHsc /O2 /c $cpp `
            /I "$source\cpp" `
            /Fo"$env:RUNNER_TEMP\polyclipping.obj"
          if ($LASTEXITCODE -ne 0) {
            throw "Clipper compilation failed."
          }

          lib /nologo `
            /OUT:"$destination\lib\polyclipping.lib" `
            "$env:RUNNER_TEMP\polyclipping.obj"
          if ($LASTEXITCODE -ne 0) {
            throw "Clipper library creation failed."
          }

      - name: Prepare ngspice 42
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $archive = "$env:RUNNER_TEMP\ngspice.7z"
          $extract = "$env:RUNNER_TEMP\ngspice-source"
          $destination = "$root\ngspice-42"
          $path = "project/ngspice/ng-spice-rework/old-releases/42/ngspice-42_dll_64.7z"

          $mirrors = @(
            "https://phoenixnap.dl.sourceforge.net/$path",
            "https://netix.dl.sourceforge.net/$path",
            "https://versaweb.dl.sourceforge.net/$path"
          )

          $downloaded = $false
          foreach ($url in $mirrors) {
            Remove-Item $archive -Force -ErrorAction SilentlyContinue

            & curl.exe --fail --location --retry 3 --connect-timeout 30 `
              --output $archive $url

            if ($LASTEXITCODE -eq 0 -and (Test-Path $archive)) {
              & 7z t $archive | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $downloaded = $true
                break
              }
            }
          }

          if (-not $downloaded) {
            throw "Could not download a valid ngspice 42 archive."
          }

          & 7z x $archive "-o$extract" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract ngspice 42."
          }

          $header = Get-ChildItem $extract -Recurse -Filter sharedspice.h |
            Select-Object -First 1
          $dll = Get-ChildItem $extract -Recurse -Filter ngspice.dll |
            Select-Object -First 1
          $analogModel = Get-ChildItem $extract -Recurse -Filter analog.cm |
            Select-Object -First 1

          if (-not $header -or -not $dll -or -not $analogModel) {
            throw "ngspice 42 headers, DLL, or code models were not found."
          }

          New-Item -ItemType Directory -Force `
            -Path "$destination\include", "$destination\bin\ngspice" | Out-Null

          Copy-Item "$($header.Directory.Parent.FullName)\*" `
            "$destination\include" -Recurse -Force
          Copy-Item $dll.FullName "$destination\bin\ngspice.dll"
          Copy-Item "$($analogModel.Directory.FullName)\*" `
            "$destination\bin\ngspice" -Recurse -Force

      - name: Adapt dependency paths for GitHub runner
        shell: pwsh
        run: |
          @'
          VCPKG = C:/vcpkg/installed/x64-windows

          win32 {
              INCLUDEPATH += $$VCPKG/include
              LIBS += -L$$VCPKG/lib -lgit2
          }
          '@ | Set-Content "pri/libgit2detect.pri"

          @'
          QUAZIP = $$absolute_path(../../quazip-1.4)

          win32 {
              INCLUDEPATH += $$QUAZIP/include/QuaZip-Qt6-1.4
              LIBS += -L$$QUAZIP/lib -lquazip1-qt6
          }
          '@ | Set-Content "pri/quazipdetect.pri"

      - name: Build Fritzing
        shell: pwsh
        run: |
          $boostRoot = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..\boost_1_85_0").Path -replace "\\", "/"
          qmake phoenix.pro "QMAKE_TARGET.arch=x86_64" "boost_root=$boostRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Fritzing qmake configuration failed."
          }

          nmake release
          if ($LASTEXITCODE -ne 0) {
            throw "Fritzing compilation failed."
          }

      - name: Assemble portable application
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $release = Resolve-Path "..\release64"
          $package = "$env:RUNNER_TEMP\Fritzing-Windows-x64"

          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$release\Fritzing.exe" $package
          Copy-Item "translations" "$package\translations" -Recurse
          Copy-Item "sketches" "$package\sketches" -Recurse
          Copy-Item "help" "$package\help" -Recurse
          Copy-Item "$root\fritzing-parts" "$package\fritzing-parts" -Recurse
          Copy-Item "$root\ngspice-42\bin\ngspice.dll" $package
          Copy-Item "$root\ngspice-42\bin\ngspice" "$package\ngspice" -Recurse
          Copy-Item "$root\quazip-1.4\bin\quazip1-qt6.dll" $package

          windeployqt "$package\Fritzing.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw
          if ($LASTEXITCODE -ne 0) {
            throw "Qt runtime deployment failed."
          }

          Copy-Item "C:\vcpkg\installed\x64-windows\bin\*.dll" `
            $package -Force

          Copy-Item "README.md", "INSTALL.txt", "LICENSE.GPL3", "LICENSE.CC-BY-SA" `
            $package

          $env:QT_QPA_PLATFORM = "offscreen"
          & "$package\Fritzing.exe" `
            -pp "$package\fritzing-parts" `
            -db "$package\fritzing-parts\parts.db"
          if ($LASTEXITCODE -ne 0) {
            throw "Fritzing parts database creation failed."
          }

          Compress-Archive -Path $package `
            -DestinationPath "$env:RUNNER_TEMP\Fritzing-Windows-x64.zip"

      - name: Upload Fritzing archive
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-x64
          path: ${{ runner.temp }}\Fritzing-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
