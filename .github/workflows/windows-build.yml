name: Build Fritzing for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Check out Fritzing source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Enable MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtserialport qt5compat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install `
            libgit2:x64-windows `
            zlib:x64-windows

      - name: Download header-only and source dependencies
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path

          git clone --depth 1 --branch boost-1.85.0 `
            https://github.com/boostorg/boost.git `
            "$root\boost_1_85_0"

          git clone --depth 1 --branch develop `
            https://github.com/fritzing/fritzing-parts.git `
            "$root\fritzing-parts"

          git clone --depth 1 --branch v1.3.1 `
            https://github.com/svgpp/svgpp.git `
            "$root\svgpp-1.3.1"

      - name: Build QuaZip against installed Qt
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $source = "$env:RUNNER_TEMP\quazip"
          $build = "$env:RUNNER_TEMP\quazip-build"
          $prefix = "$root\quazip-1.4"

          git clone --depth 1 --branch v1.4 `
            https://github.com/stachenov/quazip.git $source

          cmake -S $source -B $build `
            -DQUAZIP_QT_MAJOR_VERSION=6 `
            -DQUAZIP_FETCH_LIBS=OFF `
            -DQUAZIP_BZIP2=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\vcpkg\installed\x64-windows"

          cmake --build $build --config Release --parallel
          cmake --install $build --config Release --prefix $prefix

      - name: Prepare Clipper 6.4.2
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $archive = "$env:RUNNER_TEMP\clipper.zip"
          $extract = "$env:RUNNER_TEMP\clipper-source"
          $destination = "$root\Clipper1-6.4.2"

          Invoke-WebRequest `
            "https://sourceforge.net/projects/polyclipping/files/clipper_ver6.4.2.zip/download" `
            -OutFile $archive
          Expand-Archive $archive -DestinationPath $extract -Force

          $cpp = Get-ChildItem $extract -Recurse -Filter polyclipping.cpp |
            Select-Object -First 1
          $header = Get-ChildItem $extract -Recurse -Filter clipper.hpp |
            Select-Object -First 1
          if (-not $cpp -or -not $header) {
            throw "Clipper 6.4.2 source files were not found."
          }

          New-Item -ItemType Directory -Force `
            -Path "$destination\include\polyclipping", "$destination\lib" | Out-Null
          Copy-Item $header.FullName "$destination\include\polyclipping\clipper.hpp"

          cl /nologo /std:c++20 /EHsc /O2 /c $cpp.FullName `
            /I $cpp.Directory.FullName `
            /Fo"$env:RUNNER_TEMP\polyclipping.obj"
          lib /nologo `
            /OUT:"$destination\lib\polyclipping.lib" `
            "$env:RUNNER_TEMP\polyclipping.obj"

      - name: Prepare ngspice 42
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $archive = "$env:RUNNER_TEMP\ngspice.7z"
          $extract = "$env:RUNNER_TEMP\ngspice-source"
          $destination = "$root\ngspice-42"

          Invoke-WebRequest `
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/42/ngspice-42_dll_64.7z/download" `
            -OutFile $archive
          & 7z x $archive "-o$extract" -y

          $header = Get-ChildItem $extract -Recurse -Filter sharedspice.h |
            Select-Object -First 1
          $dll = Get-ChildItem $extract -Recurse -Filter ngspice.dll |
            Select-Object -First 1
          if (-not $header -or -not $dll) {
            throw "ngspice 42 headers or DLL were not found."
          }

          New-Item -ItemType Directory -Force `
            -Path "$destination\include", "$destination\bin" | Out-Null
          Copy-Item "$($header.Directory.Parent.FullName)\*" `
            "$destination\include" -Recurse -Force
          Copy-Item $dll.FullName "$destination\bin\ngspice.dll"

      - name: Adapt dependency paths for GitHub runner
        shell: pwsh
        run: |
          @'
          VCPKG = $$(VCPKG_ROOT)/installed/x64-windows

          win32 {
              INCLUDEPATH += $$VCPKG/include
              LIBS += -L$$VCPKG/lib -lgit2
          }
          '@ | Set-Content "pri/libgit2detect.pri"

          @'
          QUAZIP = $$absolute_path(../../quazip-1.4)

          win32 {
              INCLUDEPATH += $$QUAZIP/include/QuaZip-Qt6-1.4
              LIBS += -L$$QUAZIP/lib -lquazip1-qt6
          }
          '@ | Set-Content "pri/quazipdetect.pri"

      - name: Build Fritzing
        shell: pwsh
        run: |
          qmake phoenix.pro "QMAKE_TARGET.arch=x86_64"
          nmake release

      - name: Assemble portable application
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $release = Resolve-Path "..\release64"
          $package = "$env:RUNNER_TEMP\Fritzing-Windows-x64"

          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$release\Fritzing.exe" $package
          Copy-Item "translations" "$package\translations" -Recurse
          Copy-Item "sketches" "$package\sketches" -Recurse
          Copy-Item "help" "$package\help" -Recurse
          Copy-Item "$root\fritzing-parts" "$package\fritzing-parts" -Recurse
          Copy-Item "$root\ngspice-42\bin\ngspice.dll" $package
          Copy-Item "$root\quazip-1.4\bin\quazip1-qt6.dll" $package

          windeployqt "$package\Fritzing.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw

          Copy-Item "C:\vcpkg\installed\x64-windows\bin\*.dll" `
            $package -Force

          Copy-Item "README.md", "INSTALL.txt", "LICENSE.GPL3", "LICENSE.CC-BY-SA" `
            $package

          Compress-Archive -Path $package `
            -DestinationPath "$env:RUNNER_TEMP\Fritzing-Windows-x64.zip"

      - name: Upload Fritzing archive
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-x64
          path: ${{ runner.temp }}\Fritzing-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
