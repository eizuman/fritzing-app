name: Build Fritzing for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      VCPKG_ROOT: C:\vcpkg
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64

    steps:
      - name: Check out Fritzing source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Enable MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtserialport qtsvg qt5compat

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            boost:x64-windows `
            libgit2:x64-windows `
            quazip[qt6]:x64-windows

      - name: Download Fritzing parts and build dependencies
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path

          git clone --depth 1 --branch develop `
            https://github.com/fritzing/fritzing-parts.git `
            "$root\fritzing-parts"

          git clone --depth 1 --branch v1.3.1 `
            https://github.com/svgpp/svgpp.git `
            "$root\svgpp-1.3.1"

          Invoke-WebRequest `
            "https://sourceforge.net/projects/polyclipping/files/clipper_ver6.4.2.zip/download" `
            -OutFile "$env:RUNNER_TEMP\clipper.zip"
          Expand-Archive "$env:RUNNER_TEMP\clipper.zip" -DestinationPath "$root\Clipper1-6.4.2"

          $clipperCpp = Get-ChildItem "$root\Clipper1-6.4.2" -Recurse -Filter polyclipping.cpp |
            Select-Object -First 1
          $clipperHeader = Get-ChildItem "$root\Clipper1-6.4.2" -Recurse -Filter clipper.hpp |
            Select-Object -First 1
          if (-not $clipperCpp -or -not $clipperHeader) {
            throw "Clipper 6.4.2 source files were not found."
          }

          $clipperInclude = $clipperHeader.Directory.FullName
          $clipperLib = "$root\Clipper1-6.4.2\lib"
          New-Item -ItemType Directory -Force -Path $clipperLib | Out-Null
          cl /nologo /std:c++20 /EHsc /O2 /c $clipperCpp.FullName `
            /I $clipperInclude `
            /Fo"$env:RUNNER_TEMP\polyclipping.obj"
          lib /nologo /OUT:"$clipperLib\polyclipping.lib" `
            "$env:RUNNER_TEMP\polyclipping.obj"

          Invoke-WebRequest `
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/42/ngspice-42_dll_64.7z/download" `
            -OutFile "$env:RUNNER_TEMP\ngspice.7z"
          & 7z x "$env:RUNNER_TEMP\ngspice.7z" "-o$root\ngspice-42" -y

      - name: Adapt dependency paths for the GitHub runner
        shell: pwsh
        run: |
          @'
          VCPKG_ROOT = $$(VCPKG_ROOT)

          win32 {
              INCLUDEPATH += $$VCPKG_ROOT/include
              LIBS += -L$$VCPKG_ROOT/lib -lgit2
          }
          '@ | Set-Content "pri/libgit2detect.pri"

          @'
          VCPKG_ROOT = $$(VCPKG_ROOT)

          win32 {
              INCLUDEPATH += $$VCPKG_ROOT/include/QuaZip-Qt6-1.4
              LIBS += -L$$VCPKG_ROOT/lib -lquazip1-qt6
          }
          '@ | Set-Content "pri/quazipdetect.pri"

      - name: Find ngspice files
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:GITHUB_WORKSPACE\..\..").Path
          $ngspice = "$root\ngspice-42"

          $header = Get-ChildItem $ngspice -Recurse -Filter sharedspice.h |
            Select-Object -First 1
          $dll = Get-ChildItem $ngspice -Recurse -Filter ngspice.dll |
            Select-Object -First 1

          if (-not $header -or -not $dll) {
            throw "ngspice headers or DLL were not found."
          }

          "NGSPICE_INCLUDE=$($header.Directory.Parent.FullName)" |
            Out-File $env:GITHUB_ENV -Append
          "NGSPICE_DLL=$($dll.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Build Fritzing
        shell: pwsh
        run: |
          @'
          NGSPICE_INCLUDE = $$(NGSPICE_INCLUDE)
          INCLUDEPATH += $$NGSPICE_INCLUDE
          '@ | Set-Content "pri/spicedetect.pri"

          qmake phoenix.pro "QMAKE_TARGET.arch=x86_64"
          nmake release

      - name: Assemble portable application
        shell: pwsh
        run: |
          $release = Resolve-Path "..\release64"
          $package = "$env:RUNNER_TEMP\Fritzing-Windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$release\Fritzing.exe" $package
          Copy-Item "translations" "$package\translations" -Recurse
          Copy-Item "sketches" "$package\sketches" -Recurse
          Copy-Item "help" "$package\help" -Recurse
          Copy-Item "..\..\fritzing-parts" "$package\fritzing-parts" -Recurse
          Copy-Item $env:NGSPICE_DLL "$package\ngspice.dll"

          windeployqt "$package\Fritzing.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw

          Copy-Item "README.md","INSTALL.txt","LICENSE.GPL3","LICENSE.CC-BY-SA" $package

          Compress-Archive -Path $package -DestinationPath `
            "$env:RUNNER_TEMP\Fritzing-Windows-x64.zip"

      - name: Upload Fritzing archive
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-x64
          path: ${{ runner.temp }}\Fritzing-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
